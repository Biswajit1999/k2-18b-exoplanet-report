<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">K2-18 b report research maturity before and after upgrade</title>
  <desc id="desc">Ten paired horizontal bars compare the repository-practice audit before and after the upgrade. Total score rises from 45 to 96 out of 100.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="64" y="62" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Research-practice maturity audit</text>
  <text x="64" y="94" font-family="system-ui,sans-serif" font-size="16" fill="#475569">K2-18 b report · expert heuristic, not peer review or a scientific-merit score</text>
  <rect x="820" y="39" width="136" height="54" rx="10" fill="#fff7ed"/><text x="888" y="73" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#9a3412">45 before</text>
  <rect x="972" y="39" width="164" height="54" rx="10" fill="#ecfeff"/><text x="1054" y="73" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#155e75">96 after</text>
  <g font-family="system-ui,sans-serif" font-size="14" fill="#334155">
